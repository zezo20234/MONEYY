<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Firebase Realtime Database (live sync between all phones)
const FB={apiKey:"AIzaSyAfm1SkQSqwpf-82kWrsTgoiXgk2DMOSpU",authDomain:"retrocallapp.firebaseapp.com",databaseURL:"https://retrocallapp-default-rtdb.firebaseio.com",projectId:"retrocallapp",storageBucket:"retrocallapp.firebasestorage.app",messagingSenderId:"364436629934",appId:"1:364436629934:web:080df2aa03fad1f6fcc03f"};
const CV=4; // v4: no built-in challenges; Zezo adds them for each day
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cap=s=>s[0].toUpperCase()+s.slice(1);
const td=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PC={lilly:'#ff5a67',asser:'#2ecc71'};
let S=JSON.parse(localStorage.S||'null')||{start:td(),cv:CV,win:{},claim:{},chal:{},bonus:{lilly:0,asser:0},pin:"1234"};
let who=localStorage.who||'',zd=0,ok=0,cf='',busy='',tab=localStorage.tab||'today',ei='',db=null,SV=null,off=0,sup='';
if(!['today','live','score','set'].includes(tab))tab='today';
const save=()=>localStorage.S=JSON.stringify(S);
const rr=()=>{if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()};
function setp(p,v){let o=S,k=p.split('/');k.slice(0,-1).forEach(x=>o=o[x]=o[x]||{});v===null?delete o[k.at(-1)]:o[k.at(-1)]=v;save();if(db)db.ref(p).set(v).catch(()=>{});render()}
function mig(){if((S.cv||0)>=CV)return;S.cv=CV;save();if(db){['ch','custom','pick'].forEach(k=>db.ref(k).remove().catch(()=>{}));db.ref('cv').set(CV)}}
function startSync(){
 if(!window.firebase)return dot();
 try{
  firebase.initializeApp(FB);db=firebase.database();SV=firebase.database.ServerValue;
  db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
  db.ref('.info/connected').on('value',s=>{ok=s.val()?1:0;dot();if(ok)pres();rr()});
  db.ref('/').on('value',s=>{let d=s.val();if(d)applyRemote(d);else db.ref('/').set(JSON.parse(JSON.stringify(S)))},()=>{ok=0;dot()});
 }catch(e){db=null}
}
function applyRemote(d){
 S={start:S.start,pin:S.pin,cv:S.cv,win:{},claim:{},chal:{},...d};
 S.bonus={lilly:0,asser:0,...(d.bonus||{})};
 mig();save();rr();revCheck();cfgSync();
 if(d.evt)onEvt(d.evt);
 if(d.msg)onMsg(d.msg);
}
const dot=()=>{let e=$('#dot');if(e)e.className='dot'+(ok?' on':'')}
// ---------- who is online (a phone counts as online while the app is open on screen)
function pres(){
 if(!db||!ok||!who)return;
 const r=db.ref('presence/'+who);
 if(document.hidden)r.set({on:false,ts:SV.TIMESTAMP}).catch(()=>{});
 else r.onDisconnect().set({on:false,ts:SV.TIMESTAMP}).then(()=>r.set({on:true,ts:SV.TIMESTAMP})).catch(()=>{});
}
function unpres(){if(db&&who)db.ref('presence/'+who).set({on:false,ts:SV.TIMESTAMP}).catch(()=>{})}
document.addEventListener('visibilitychange',pres);
addEventListener('pagehide',unpres);
addEventListener('pageshow',pres);
const pdot=p=>{const o=((S.presence||{})[p]||{}).on;return `<span style="color:${o?'var(--g)':'var(--mu)'}">${o?'🟢':'⚪'} ${p=='zezo'?'👑 Zezo':cap(p)}</span>`};
const presBar=()=>`<p style="text-align:center;font-size:13px;margin:6px 0">${['lilly','asser','zezo'].map(pdot).join(' &nbsp; ')}</p>`;
// a challenge only unlocks when BOTH players are in the app at the same moment
let rb={};
function revCheck(){
 if(!db||!ok||dayN()<1)return;
 const P=S.presence||{};
 if(!(P.lilly&&P.lilly.on&&P.asser&&P.asser.on))return;
 cl(curDay()).forEach(c=>{

// ---------- overlay
function fx(cls,html,btn){
 clearFx(1);let e=document.createElement('div');e.id='fx';e.className=cls;
 e.innerHTML=html+`<button class="b ${cls=='fw'?'gr':'d'}" style="max-width:260px;margin-top:24px" onclick="clearFx()">${btn}</button>`;
 document.body.append(e);fxT=setTimeout(()=>clearFx(),11000);return e;
}
function clearFx(now){
 clearTimeout(fxT);cancelAnimationFrame(raf);let e=$('#fx');if(!e)return;
 if(now)e.remove();else{e.classList.add('out');setTimeout(()=>e.remove(),400)}
}

function confetti(cv){
 const r=Math.min(devicePixelRatio||1,2),x=cv.getContext('2d'),W=cv.width=innerWidth*r,H=cv.height=innerHeight*r,
  cols=['#ffd76a','#2ecc71','#ff4757','#ffffff','#7dffa8','#ff9fb0'];let P=[];
 const mk=(px,py,vx,vy)=>P.push({x:px,y:py,vx,vy,w:6+Math.random()*8,h:4+Math.random()*6,a:Math.random()*6.28,va:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]});
 for(let i=0;i<90;i++){mk(0,H,(3+Math.random()*8)*r,-(8+Math.random()*12)*r);mk(W,H,-(3+Math.random()*8)*r,-(8+Math.random()*12)*r)}
 setTimeout(()=>{for(let i=0;i<90;i++){let a=Math.random()*6.28,s=(3+Math.random()*8)*r;mk(W/2,H*.32,Math.cos(a)*s,Math.sin(a)*s)}},900);
 const t0=performance.now();
 (function step(t){
  x.clearRect(0,0,W,H);let el=t-t0;
  if(el<5000&&Math.random()<.5)mk(Math.random()*W,-10,(Math.random()-.5)*2*r,(2+Math.random()*3)*r);
  for(const p of P){p.vy+=.3*r;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.scale(1,Math.cos(p.a*2));x.fillStyle=p.c;x.fillRect(-p.w*r/2,-p.h*r/2,p.w*r,p.h*r);x.restore()}
  P=P.filter(p=>p.y<H+30);
  if(P.length||el<5000)raf=requestAnimationFrame(step);
 })(t0);
}

function ac(){
 try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();OUT=AC.createDynamicsCompressor();OUT.connect(AC.destination)}
  if(AC.state=='suspended')AC.resume()}catch(e){}
 return AC;
}
['pointerdown','touchend','click','keydown'].forEach(k=>addEventListener(k,ac,{passive:true}));
function tn(f,t,d,o={}){
 const a=AC,s=a.currentTime+t,os=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter(),v=o.v??.2,rel=o.rel??.08;
 os.type=o.type||'sine';os.frequency.setValueAtTime(f,s);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,s+d);
 if(o.vib){let l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vib;lg.gain.value=f*.025;l.connect(lg);lg.connect(os.frequency);l.start(s);l.stop(s+d+.1)}
 fl.type='lowpass';fl.frequency.value=o.lp||9000;
 g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.setValueAtTime(v,s+Math.max(d-rel,.03));g.gain.exponentialRampToValueAtTime(.0001,s+d);
 os.connect(fl);fl.connect(g);g.connect(OUT);os.start(s);os.stop(s+d+.05);
}
function nz(t,d,o={}){
 const a=AC,n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),st=a.currentTime+t;
 for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
 s.buffer=b;f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||2000,st);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,st+d);f.Q.value=o.q||.8;
 g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(o.v||.2,st+(o.at||.05));g.gain.exponentialRampToValueAtTime(.0001,st+d);
 s.connect(f);f.connect(g);g.connect(OUT);s.start(st);
}
function sfx(k,again){
 if(mute||!ac())return;
 if(AC.state!='running'&&!again){addEventListener('pointerdown',()=>{if($('#fx'))sfx(k,1)},{once:true,passive:true});return} // phone blocked audio: play on first tap
 if(k=='win'){
  nz(0,.5,{f:400,to:3500,v:.18});                                   // whoosh
  [523.25,659.25,783.99].forEach((f,i)=>tn(f,i*.13,.2,{type:'square',v:.1,lp:3200})); // da-da-da
  [523.25,659.25,783.99,1046.5].forEach(f=>tn(f,.42,1,{type:'triangle',v:.17}));    // DAAA chord
  tn(1046.5,.42,1,{type:'square',v:.08,lp:3500,vib:6});
  for(let i=0;i<16;i++)tn(1500+Math.random()*2600,.5+i*.07,.25,{v:.045}); // sparkles
  nz(.5,2.4,{f:3000,q:.6,v:.13,at:.5});                              // applause
 }else if(k=='lose'){
  nz(0,.3,{type:'lowpass',f:220,v:.4});                              // thud
  tn(120,0,.4,{type:'sawtooth',v:.16,lp:900});tn(113,0,.4,{type:'sawtooth',v:.16,lp:900}); // buzzer
  [[233,.45],[220,.9],[208,1.35]].forEach(([f,t])=>tn(f,t,.38,{type:'sawtooth',v:.2,lp:750,rel:.1})); // wah wah wah
  tn(196,1.8,1.6,{type:'sawtooth',v:.22,lp:700,to:140,vib:5,rel:.5}); // waaaah
 }else{
  tn(1174.7,0,.5,{v:.18,rel:.4});tn(2349,0,.3,{v:.04});tn(880,.22,.8,{v:.18,rel:.65});
 }
}
