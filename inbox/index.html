<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SMS Inbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMS Inbox</title>
<style>
    :root { --bg:#1a1a2e; --card:#23233b; --line:#34345a; --text:#f1f3ff; --muted:#9a9cc0; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b7a; --accent:#27e0d3; }
    * { box-sizing: border-box; }
    html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { max-width:520px; margin:0 auto; padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:14px; margin:0 0 18px; line-height:1.4; }
    .status { border-radius:14px; padding:16px; background:var(--card); border:1px solid var(--line); margin-bottom:16px; }
    .status b { display:block; font-size:18px; margin-bottom:4px; }
    .status.ok { border-color:var(--ok); } .status.ok b { color:var(--ok); }
    .status.wait { border-color:var(--warn); } .status.wait b { color:var(--warn); }
    .status.bad { border-color:var(--bad); } .status.bad b { color:var(--bad); }
    .status span { color:var(--muted); font-size:14px; }
    ul { list-style:none; margin:0 0 16px; padding:0; }
    li { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; font-size:14px; }
    li small { display:block; color:var(--muted); margin-top:4px; }
    li pre { margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; }
    .row { display:flex; gap:10px; }
    button { flex:1; font:inherit; font-weight:600; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }
    button.primary { background:var(--accent); color:#06222a; border:none; }
    h2 { font-size:16px; margin:26px 0 8px; }
    textarea, input { width:100%; font:inherit; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
    textarea { resize:vertical; }
    details { margin:0 0 10px; color:var(--muted); font-size:14px; }
    details summary { cursor:pointer; padding:4px 0; }
    details input { margin-top:8px; }
    a.btn { display:block; text-align:center; text-decoration:none; font-weight:600; padding:13px; border-radius:12px; border:1px solid var(--accent); color:var(--accent); margin-top:10px; }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
    <h1>SMS Inbox</h1>
    <p class="sub">Saves purchase texts when there is no internet and sends them to Money as soon as you are back online.</p>
    <div class="status" id="status" role="status" aria-live="polite"><b id="st-title">Ready</b><span id="st-text"></span></div>
    <ul id="list"></ul>
    <div class="row">
        <button class="primary" id="send">Send now</button>
        <button id="clear">Clear list</button>
    </div>
    <a class="btn" href="https://zezo20234.github.io/MONEYY/">Open Money</a>
    <h2>Add a message by hand</h2>
    <textarea id="manual" rows="5" placeholder="Paste the UrPay text, for example:&#10;credit via wallet&#10;from: someone&#10;Amount: 50 SAR&#10;Date: 12-10-2026-9:27"></textarea>
    <details id="acct">
        <summary id="acct-sum">Account (saved on this phone)</summary>
        <input id="cu" type="text" placeholder="Username, e.g. Zezo" autocapitalize="off" autocomplete="off">
        <input id="ck" type="password" placeholder="Key" autocomplete="off">
    </details>
    <button class="primary" id="add" style="width:100%">Add message</button>
</main>
<script>
(function () {
    var API = 'https://moneyy-sdwg.vercel.app/api/log-sms'; // your Vercel server
    var QKEY = 'smsQueue';
    var busy = false;

    function load() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
    function save(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }

    var elStatus = document.getElementById('status');
    var elTitle = document.getElementById('st-title');
    var elText = document.getElementById('st-text');
    var elList = document.getElementById('list');

    function setStatus(kind, title, text) {
        elStatus.className = 'status ' + kind;
        elTitle.textContent = title;
        elText.textContent = text || '';
    }

    function render() {
        var q = load();
        elList.innerHTML = '';
        q.forEach(function (item) {
            var li = document.createElement('li');
            var pre = document.createElement('pre');
            pre.textContent = item.t.split('\n').slice(0, 3).join('\n');
            var small = document.createElement('small');
            small.textContent = (item.err ? 'Problem: ' + item.err : 'Waiting to send') + ' - saved ' + new Date(item.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            li.appendChild(pre); li.appendChild(small);
            elList.appendChild(li);
        });
    }

    function saveCreds(u, k) { try { localStorage.setItem('smsCreds', JSON.stringify({ u: u, k: k })); } catch (e) {} }
    function loadCreds() { try { return JSON.parse(localStorage.getItem('smsCreds') || '{}'); } catch (e) { return {}; } }

    // 1. A new text arrives in the link: #u=USER&k=KEY&t=TEXT
    function takeFromLink() {
        var h = location.hash.replace(/^#/, '');
        if (!h) return;
        var p = new URLSearchParams(h);
        var u = p.get('u'), k = p.get('k'), t = p.get('t');
        if (u && k) saveCreds(u, k);
        if (u && k && t && t.trim()) {
            var q = load();
            var dup = q.some(function (x) { return x.u === u && x.k === k && x.t === t; });
            if (!dup) q.push({ u: u, k: k, t: t, at: Date.now() });
            save(q);
        }
        history.replaceState(null, '', location.pathname); // so a reload doesn't add it again
    }

    // 2. Send everything that is waiting.
    async function flush() {
        if (busy) return;
        var q = load();
        if (!q.length) { setStatus('ok', 'All sent', 'Nothing is waiting. Open Money to see the pop-up.'); render(); return; }
        if (!navigator.onLine) { setStatus('wait', q.length + ' waiting', 'No internet. It will send by itself when you are back online.'); render(); return; }
        busy = true;
        setStatus('wait', 'Sending...', q.length + ' text(s)');
        var sent = 0, failed = 0, ignoredReasons = [];
        for (var i = 0; i < q.length; i++) {
            var item = q[i];
            try {
                var res = await fetch(API + '?user=' + encodeURIComponent(item.u) + '&key=' + encodeURIComponent(item.k), {
                    method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: item.t
                });
                if (res.ok) {
                    var j = null;
                    try { j = await res.json(); } catch (e2) {}
                    item.done = true;
                    if (j && j.ignored && !/already received/i.test(j.ignored)) ignoredReasons.push(j.ignored);
                    else sent++;
                }
                else if (res.status === 401) { item.err = 'wrong key in the Shortcut link'; failed++; }
                else if (res.status === 400) { item.err = 'the server could not read this text'; failed++; }
                else { item.err = 'server busy, will retry'; failed++; }
            } catch (e) { item.err = 'no connection, will retry'; failed++; }
        }
        var left = load().filter(function (x) {
            return !q.some(function (y) { return y.done && y.u === x.u && y.k === x.k && y.t === x.t; });
        });
        q.forEach(function (y) {
            left.forEach(function (x) { if (x.u === y.u && x.k === y.k && x.t === y.t && y.err) x.err = y.err; });
        });
        save(left);
        busy = false;
        render();
        if (!left.length) {
            if (ignoredReasons.length) setStatus('bad', (sent ? sent + ' sent, ' : '') + ignoredReasons.length + ' ignored', 'The server said: ' + ignoredReasons[0]);
            else setStatus('ok', sent + ' sent', 'Open Money to choose where each one goes.');
        }
        else setStatus(failed ? 'bad' : 'wait', left.length + ' still waiting', 'Will try again automatically when online.');
    }

    document.getElementById('send').addEventListener('click', flush);
    document.getElementById('clear').addEventListener('click', function () {
        if (confirm('Delete the texts that have not been sent?')) { save([]); render(); flush(); }
    });
    window.addEventListener('online', flush);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) flush(); });
    setInterval(function () { if (load().length && navigator.onLine) flush(); }, 20000);

    var elManual = document.getElementById('manual'), elU = document.getElementById('cu'), elK = document.getElementById('ck'), elAcct = document.getElementById('acct');
    function fillCreds() {
        var c = loadCreds();
        if (c.u) elU.value = c.u;
        if (c.k) elK.value = c.k;
        document.getElementById('acct-sum').textContent = c.u && c.k ? 'Sending as ' + c.u + ' (tap to change)' : 'Account (fill in once)';
        elAcct.open = !(c.u && c.k);
    }
    document.getElementById('add').addEventListener('click', function () {
        var t = elManual.value.trim(), u = elU.value.trim(), k = elK.value.trim();
        if (!t) { setStatus('bad', 'Nothing to add', 'Paste the message first.'); return; }
        if (!u || !k) { elAcct.open = true; setStatus('bad', 'Username and key needed', 'Fill them in once. They are saved on this phone.'); return; }
        saveCreds(u, k);
        var q = load();
        if (!q.some(function (x) { return x.u === u && x.k === k && x.t === t; })) q.push({ u: u, k: k, t: t, at: Date.now() });
        save(q);
        elManual.value = '';
        fillCreds();
        render();
        flush();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});

    takeFromLink();
    fillCreds();
    render();
    flush();
})();
</script>
</body>
</html>
